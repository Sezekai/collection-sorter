<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection Sorter</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="titlebar">
  <button id="navtoggle" title="Show / hide the side menu (M)" aria-label="Show or hide the side menu"></button>
  <span class="tname">Collection Sorter</span><span class="tscr" id="tscr"></span>
  <span class="tdrag"></span>
  <div id="pills"></div>
  <span id="wbspace"></span>
</div>
<div id="app">
  <nav id="nav"></nav>
  <main>
    <div id="view"></div>
    <div id="logdrawer" class="hidden"></div>
    <div id="statusbar"></div>
  </main>
</div>
<div id="modal" class="modal hidden"></div>
<div id="viewer" class="viewer hidden"></div>
<div id="tip" class="hidden"></div>
<div id="toasts"></div>
<script src="fonts/fonts.js"></script>
<script src="js/theme.js"></script>
<script src="settings-defs.js"></script>
<script src="js/core.js"></script>
<script src="js/look.js"></script>
<script src="js/status.js"></script>
<script src="js/fbox.js"></script>
<script src="js/shell.js"></script>
<script src="js/setup.js"></script>
<script src="js/settings.js"></script>
<script src="js/views.js"></script>
<script src="js/knows.js"></script>
<script src="js/renamed.js"></script>
<script src="js/browse.js"></script>
<script src="js/browse2.js"></script>
<script src="js/nav.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
