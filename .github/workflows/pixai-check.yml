name: PixAI check (temporary)
on: { push: { branches: [pixai-check] } }
jobs:
  run:
    strategy: { fail-fast: false, matrix: { os: [ubuntu-latest, windows-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts && npm rebuild onnxruntime-node sharp
      - shell: bash
        run: |
          mkdir -p m && cd m
          curl -sL -o model_fp16.onnx https://huggingface.co/Mexes/pixai-tagger-v1.0-onnx-fp32-fp16-int8/resolve/main/model_fp16.onnx
          curl -sL -o selected_tags.csv https://huggingface.co/Mexes/pixai-tagger-v1.0-onnx-fp32-fp16-int8/resolve/main/selected_tags.csv
          ls -la
      - shell: bash
        run: M=$PWD/m/ node ci-check/tt.js pixai
